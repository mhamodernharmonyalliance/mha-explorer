<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MHASpace | أعماق المحيط 🦈</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://sad.adsgram.ai/js/sad-index.js"></script>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0088cc">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #030712; color: #fff; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    #splash-loader { position: fixed; inset: 0; background: #030712; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
    .spinner { width: 50px; height: 50px; border: 4px solid rgba(56,189,248,0.2); border-top: 4px solid #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 0% { transform: rotate(0); } 100% { transform: rotate(360deg); } }

    #ui-container { position: absolute; top: 15px; left: 15px; right: 15px; z-index: 10; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .hud-card { background: rgba(15,23,42,0.75); backdrop-filter: blur(12px); border: 1px solid rgba(56,189,248,0.3); border-radius: 16px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 32px rgba(0,0,0,0.37); pointer-events: auto; }
    .score-title { font-size: 12px; color: #94a3b8; }
    .score-value { font-size: 20px; font-weight: bold; color: #38bdf8; text-shadow: 0 0 10px rgba(56,189,248,0.5); }
    .badge { background: rgba(56,189,248,0.15); border: 1px solid #38bdf8; color: #38bdf8; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .badge.temp-boost { background: rgba(245,158,11,0.2); border-color: #f59e0b; color: #f59e0b; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
    .progress-box { width: 100%; background: rgba(15,23,42,0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 8px 12px; pointer-events: auto; }
    .progress-header { display: flex; justify-content: space-between; font-size: 11px; color: #cbd5e1; margin-bottom: 4px; }
    .progress-bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #0284c7, #38bdf8); border-radius: 4px; transition: width 0.3s ease; }

    #controls-container { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 10; display: grid; grid-template-columns: repeat(3, 55px); grid-template-rows: repeat(2, 55px); gap: 8px; }
    .control-btn { width: 55px; height: 55px; background: rgba(15,23,42,0.7); backdrop-filter: blur(8px); border: 1px solid rgba(56,189,248,0.4); border-radius: 50%; color: #38bdf8; font-size: 18px; display: flex; justify-content: center; align-items: center; cursor: pointer; touch-action: manipulation; }
    .control-btn:active { background: rgba(56,189,248,0.4); transform: scale(0.95); }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }

    #bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 85px; background: rgba(2,6,23,0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(56,189,248,0.3); display: flex; justify-content: center; align-items: center; padding: 0 15px; z-index: 100; box-shadow: 0 -8px 32px rgba(0,0,0,0.5); }
    .ad-btn { width: 100%; max-width: 400px; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(135deg, #10b981, #059669); border: none; border-radius: 14px; padding: 15px 20px; color: #fff; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 4px 15px rgba(16,185,129,0.4); position: relative; }
    .ad-btn:active { transform: scale(0.97); }
    .ad-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .ad-btn .icon { font-size: 24px; }
    .ad-cooldown { position: absolute; top: 4px; right: 8px; background: rgba(0,0,0,0.5); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: bold; }

    .floating-text { position: absolute; color: #f59e0b; font-weight: bold; font-size: 20px; pointer-events: none; animation: floatUp 0.8s ease-out forwards; z-index: 50; }
    @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -50px); } }
  </style>
</head>
<body>

  <div id="splash-loader">
    <div class="spinner"></div>
    <h3 style="color: #38bdf8; font-size: 18px;">جاري الغوص في أعماق MHASpace... 🦈</h3>
    <p style="color: #64748b; font-size: 12px; margin-top: 8px;">مزامنة بيانات المحيط</p>
  </div>

  <div id="canvas-container"></div>

  <div id="ui-container">
    <div class="hud-card">
      <div>
        <div class="score-title">لآلئ المحيط (MHA)</div>
        <div class="score-value" id="score-val">0.00</div>
      </div>
      <div>
        <span class="badge" id="rank-badge">مستوى القرش (1x)</span>
      </div>
    </div>

    <div class="progress-box">
      <div class="progress-header">
        <span>عمق المحيط العالمي</span>
        <span><span id="progress-text">0.0000</span>%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div style="font-size: 10px; color: #64748b; margin-top: 4px; text-align: left;" id="db-status">جاري التحميل...</div>
    </div>
  </div>

  <div id="controls-container">
    <button class="control-btn" id="btn-up">▲</button>
    <button class="control-btn" id="btn-left">◄</button>
    <button class="control-btn" id="btn-down">▼</button>
    <button class="control-btn" id="btn-right">►</button>
  </div>

  <div id="bottom-bar">
    <button class="ad-btn" onclick="watchTimedAd()" id="ad-btn">
      <span class="icon">📺</span>
      <span id="ad-btn-text">شاهد إعلان → تعزيز 3x لمدة 90 ثانية</span>
      <span class="ad-cooldown" id="ad-cooldown" style="display:none;">0:00</span>
    </button>
  </div>

  <script src="app.js"></script>
</body>
</html>
