<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MHA Explorer</title>

  <!-- Adsgram SDK Integration -->
  <script src="https://sad.adsgram.ai/js/sad-index.js"></script>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    input, textarea, button {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      box-sizing: border-box;
    }
    input, textarea {
      background-color: #1e1e1e;
      color: #fff;
    }
    button {
      background-color: #0088cc;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    button:disabled {
      background-color: #555;
      cursor: not-allowed;
    }
    .ad-card {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      border: 1px solid #333;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>نشر إعلان جديد</h2>
    <input type="text" id="entity" placeholder="عنوان الإعلان / الكيان" maxlength="80">
    <textarea id="description" placeholder="وصف الإعلان" rows="4" maxlength="1500"></textarea>
    <input type="password" id="deleteKey" placeholder="مفتاح الحذف الخفي">
    <button id="publishBtn" onclick="publishAd()">نشر (شاهد إعلان لتأكيد النشر) 🎬</button>

    <hr style="border-color: #333; margin: 30px 0;">

    <h2>الإعلانات المتاحة</h2>
    <div id="adsList"></div>
  </div>

  <script>
    // تهيئة Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) tg.ready();

    // معرف المستخدم المأخوذ من تليجرام أو معرّف عشوائي مؤقت
    const authorId = tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id) : "guest_user";

    // تهيئة Adsgram بـ BlockID الخاص بك: 48760
    const AdController = window.Adsgram.init({ blockId: "48760" });

    // دالة مساعدة لمشاهدة الإعلان ومطالبة المستخدم بالانتهاء
    async function showAdsgramVideo() {
      try {
        const result = await AdController.show();
        console.log("Ad completed successfully:", result);
        return true;
      } catch (error) {
        console.warn("Ad skipped or failed:", error);
        alert("يجب عليك مشاهدة الإعلان حتى النهاية لإتمام العملية!");
        return false;
      }
    }

    // 1️⃣ دالة النشر مع شرط مشاهدة الإعلان
    async function publishAd() {
      const entity = document.getElementById("entity").value.trim();
      const description = document.getElementById("description").value.trim();
      const deleteKey = document.getElementById("deleteKey").value.trim();

      if (!entity || !description || !deleteKey) {
        alert("يرجى ملء جميع الحقول المطلوبة!");
        return;
      }

      const btn = document.getElementById("publishBtn");
      btn.disabled = true;

      // مشاهدة الإعلان أولاً
      const watched = await showAdsgramVideo();
      if (!watched) {
        btn.disabled = false;
        return;
      }

      try {
        const response = await fetch("/api/publish", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ entity, description, authorId, deleteKey })
        });

        const data = await response.json();
        if (response.ok && data.ok) {
          alert("تم نشر الإعلان بنجاح!");
          document.getElementById("entity").value = "";
          document.getElementById("description").value = "";
          document.getElementById("deleteKey").value = "";
          loadAds();
        } else {
          alert("حدث خطأ أثناء النشر: " + (data.error || "خطأ غير معروف"));
        }
      } catch (err) {
        alert("فشل الاتصال بالسيرفر");
      } finally {
        btn.disabled = false;
      }
    }

    // 2️⃣ دالة جمع النقطة (Boost) مع شرط مشاهدة الإعلان
    async function boostAd(id) {
      // مشاهدة الإعلان أولاً قبل رفع النقاط
      const watched = await showAdsgramVideo();
      if (!watched) return;

      try {
        const response = await fetch("/api/boost", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, authorId })
        });

        const data = await response.json();
        if (response.ok && data.ok) {
          alert(`تم جمع النقطة بنجاح! النقاط الحالية: ${data.points}`);
          loadAds();
        } else if (response.status === 429) {
          const hoursLeft = Math.ceil(data.waitMs / (1000 * 60 * 60));
          alert(`يرجى الانتظار ${hoursLeft} ساعة تقريباً للحصول على النقطة القادمة.`);
        } else {
          alert("خطأ: " + (data.error || "عذراً، لا يمكنك زيادة نقاط هذا الإعلان"));
        }
      } catch (err) {
        alert("فشل الاتصال بالسيرفر");
      }
    }

    // 3️⃣ دالة حذف الإعلان
    async function deleteAd(id) {
      const deleteKey = prompt("أدخل مفتاح الحذف الخاص بالإعلان:");
      if (!deleteKey) return;

      try {
        const response = await fetch("/api/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, authorId, deleteKey })
        });

        const data = await response.json();
        if (response.ok && data.ok) {
          alert("تم حذف الإعلان بنجاح");
          loadAds();
        } else {
          alert("فشل الحذف: مفتاح غير صحيح أو خطأ في الصلاحيات");
        }
      } catch (err) {
        alert("فشل الاتصال بالسيرفر");
      }
    }

    // جلب الإعلانات وعرضها
    async function loadAds() {
      try {
        const res = await fetch("https://mhaexplorer-ac7a7-default-rtdb.europe-west1.firebasedatabase.app/ads.json");
        const data = await res.json();
        const container = document.getElementById("adsList");
        container.innerHTML = "";

        if (!data) {
          container.innerHTML = "<p>لا توجد إعلانات حالياً.</p>";
          return;
        }

        Object.keys(data).forEach(id => {
          const ad = data[id];
          const div = document.createElement("div");
          div.className = "ad-card";
          div.innerHTML = `
            <h3>${ad.entity}</h3>
            <p>${ad.description}</p>
            <p><small>النقاط: <strong>${ad.points || 0}</strong></small></p>
            <button onclick="boostAd('${id}')">جمع نقطة 🚀 (مشاهدة إعلان)</button>
            ${ad.authorId === authorId ? `<button onclick="deleteAd('${id}')" style="background-color: #d9534f; margin-top: 8px;">حذف الإعلان 🗑️</button>` : ''}
          `;
          container.appendChild(div);
        });
      } catch (e) {
        console.error("فشل تحميل الإعلانات:", e);
      }
    }

    // تحميل الإعلانات فور فتح الصفحة
    loadAds();
  </script>
</body>
</html>
