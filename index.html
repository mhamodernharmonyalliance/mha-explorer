<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MHA Explorer — Soon</title>
<style>
  :root {
    --navy: #1B3A5C;
    --gold: #D4A93C;
    --paper: #F5F0E6;
    --crimson: #B22222;
    --border: rgba(212, 169, 60, 0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Serif', serif;
    background: var(--paper);
    color: #1A1A1A;
    line-height: 1.8;
    padding: 20px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  .hero {
    text-align: center;
    padding: 30px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 30px;
  }
  .hero img { width: 120px; height: 120px; object-fit: contain; }
  .hero h1 {
    color: var(--navy);
    letter-spacing: 4px;
    margin-top: 10px;
    font-size: 1.8rem;
  }
  .hero p { color: var(--crimson); letter-spacing: 2px; margin-top: 4px; }
  .soon {
    display: inline-block;
    margin-top: 14px;
    padding: 6px 22px;
    background: #fff;
    border: 1px solid var(--gold);
    border-radius: 30px;
    color: var(--navy);
    letter-spacing: 6px;
    font-size: 0.8rem;
    font-weight: 700;
  }

  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(27,58,92,0.05);
  }
  .card h2 {
    color: var(--navy);
    font-size: 1rem;
    margin-bottom: 14px;
    letter-spacing: 1px;
  }
  .card h2::before { content: "◆ "; color: var(--gold); }

  input, textarea {
    width: 100%;
    padding: 10px 12px;
    background: #FDFBF6;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-family: inherit;
    font-size: 1rem;
    margin-bottom: 12px;
    resize: vertical;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--navy);
  }
  textarea { min-height: 80px; }

  button {
    width: 100%;
    padding: 12px;
    background: var(--navy);
    color: var(--paper);
    border: 1px solid var(--gold);
    border-radius: 3px;
    font-family: inherit;
    font-size: 1rem;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.3s;
  }
  button:hover { background: var(--gold); color: var(--navy); }
  button:disabled { background: #ccc; cursor: not-allowed; }

  .ad {
    background: #FDFBF6;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .ad-entity {
    color: var(--navy);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .ad-desc {
    color: #555;
    font-size: 0.9rem;
    margin-bottom: 8px;
  }
  .ad-tg {
    color: var(--gold);
    font-size: 0.85rem;
    font-family: monospace;
    word-break: break-all;
    text-decoration: none;
  }
  .ad-tg:hover { text-decoration: underline; }
  .ad-date {
    color: #aaa;
    font-size: 0.72rem;
    margin-top: 6px;
  }
  .ad-mine {
    display: inline-block;
    background: var(--gold);
    color: var(--navy);
    font-size: 0.65rem;
    padding: 2px 8px;
    border-radius: 10px;
    margin-right: 6px;
    font-weight: 700;
  }
  .ad-actions {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
  }
  .btn-delete {
    width: auto;
    padding: 5px 14px;
    font-size: 0.78rem;
    background: var(--crimson);
    border-color: var(--crimson);
    color: #fff;
    letter-spacing: 1px;
  }
  .btn-delete:hover { background: #8B1A1A; color: #fff; }

  .empty {
    text-align: center;
    color: #aaa;
    padding: 20px;
    font-size: 0.9rem;
  }
  .notice {
    background: #FBF6EC;
    border: 1px dashed var(--crimson);
    border-radius: 4px;
    padding: 14px 18px;
    color: var(--crimson);
    font-size: 0.85rem;
    line-height: 1.9;
    text-align: center;
    margin-bottom: 20px;
  }
  .notice strong { display: block; margin-bottom: 4px; }
</style>
</head>
<body>

<div class="wrap">

  <header class="hero">
    <img src="mha-logo.png" alt="MHA">
    <h1>MHA Explorer</h1>
    <p>حيث العلم يُنشر</p>
    <div class="soon">SOON</div>
  </header>

  <div class="card">
    <h2>نموذج النشر</h2>
    <input id="entity" maxlength="60" placeholder="اسم الكيان المعلن">
    <textarea id="desc" maxlength="300" placeholder="وصف الإعلان"></textarea>
    <input id="tg" placeholder="https://t.me/username">
    <button id="publish">نشر الإعلان</button>
  </div>

  <div class="card">
    <h2>الإعلانات المنشورة</h2>
    <div id="list"><div class="empty">جاري التحميل...</div></div>
  </div>

  <div class="notice">
    <strong>تنبيه</strong>
    أي تعامل تقوم به على هذا الموقع هو على مسؤوليتك الشخصية وحدك.
  </div>

</div>

<script>
  // ====== الإعداد (جاهز) ======
  const FIREBASE_URL = "https://mhaexplorer-ac7a7-default-rtdb.europe-west1.firebasedatabase.app";
  const KEY_STORE = "MHA_MY_KEYS";
  const RATE_MS = 5 * 60 * 1000;

  // ====== عناصر الصفحة ======
  const $entity = document.getElementById("entity");
  const $desc   = document.getElementById("desc");
  const $tg     = document.getElementById("tg");
  const $btn    = document.getElementById("publish");
  const $list   = document.getElementById("list");

  // ====== أدوات ======
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[c]);
  }

  function getMyKeys() {
    try { return JSON.parse(localStorage.getItem(KEY_STORE) || "{}"); }
    catch (e) { return {}; }
  }
  function addMyKey(id, key) {
    const k = getMyKeys();
    k[id] = key;
    localStorage.setItem(KEY_STORE, JSON.stringify(k));
  }
  function removeMyKey(id) {
    const k = getMyKeys();
    delete k[id];
    localStorage.setItem(KEY_STORE, JSON.stringify(k));
  }
  function newKey() {
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  // ====== نشر الإعلان ======
  $btn.addEventListener("click", async () => {
    const entity = $entity.value.trim();
    const desc   = $desc.value.trim();
    const tg     = $tg.value.trim();

    if (!entity || !desc || !tg) {
      alert("املأ الحقول الثلاثة.");
      return;
    }
    if (!/^https?:\/\/(t\.me|telegram\.me)\//i.test(tg)) {
      alert("الرابط يجب أن يبدأ بـ https://t.me/");
      return;
    }

    const last = Number(localStorage.getItem("MHA_LAST") || 0);
    const now = Date.now();
    if (now - last < RATE_MS) {
      const min = Math.ceil((RATE_MS - (now - last)) / 60000);
      alert(`انتظر ${min} دقيقة قبل النشر مرة أخرى.`);
      return;
    }

    $btn.disabled = true;
    $btn.textContent = "جاري النشر...";

    const key = newKey();

    try {
      const res = await fetch(FIREBASE_URL + "/ads.json", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          entity: entity,
          description: desc,
          telegram: tg,
          createdAt: now,
          deleteKey: key
        })
      });

      if (!res.ok) throw new Error("fail");

      const data = await res.json();
      addMyKey(data.name, key);
      localStorage.setItem("MHA_LAST", String(now));

      $entity.value = "";
      $desc.value = "";
      $tg.value = "";

      await loadAds();
      alert("تم النشر!");
    } catch (err) {
      alert("تعذر النشر.");
    } finally {
      $btn.disabled = false;
      $btn.textContent = "نشر الإعلان";
    }
  });

  // ====== تحميل الإعلانات ======
  async function loadAds() {
    try {
      const res = await fetch(FIREBASE_URL + "/ads.json");
      const data = await res.json();

      if (!data) {
        $list.innerHTML = '<div class="empty">لا توجد إعلانات بعد.</div>';
        return;
      }

      const myKeys = getMyKeys();
      const ads = Object.keys(data)
        .map(id => ({ id, ...data[id] }))
        .sort((a, b) => b.createdAt - a.createdAt);

      $list.innerHTML = ads.map(ad => {
        const d = new Date(ad.createdAt);
        const date = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
        const isMine = myKeys[ad.id] === ad.deleteKey;

        return `
          <div class="ad">
            <div class="ad-entity">
              ${isMine ? '<span class="ad-mine">إعلاني</span>' : ''}
              ◆ ${esc(ad.entity)}
            </div>
            <div class="ad-desc">${esc(ad.description)}</div>
            <a class="ad-tg" href="${esc(ad.telegram)}" target="_blank" rel="noopener">${esc(ad.telegram)}</a>
            <div class="ad-date">${date}</div>
            ${isMine ? `
              <div class="ad-actions">
                <button class="btn-delete" data-del="${ad.id}">حذف الإعلان</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join("");

      $list.querySelectorAll("[data-del]").forEach(b => {
        b.addEventListener("click", () => deleteAd(b.dataset.del));
      });

    } catch (err) {
      $list.innerHTML = '<div class="empty">تعذر التحميل.</div>';
    }
  }

  // ====== حذف الإعلان ======
  async function deleteAd(id) {
    if (!confirm("هل أنت متأكد من حذف هذا الإعلان؟")) return;

    const myKeys = getMyKeys();
    const myKey = myKeys[id];

    if (!myKey) {
      alert("لا تملك صلاحية حذف هذا الإعلان.");
      return;
    }

    try {
      const res = await fetch(`${FIREBASE_URL}/ads/${id}.json`);
      const ad = await res.json();

      if (!ad || ad.deleteKey !== myKey) {
        alert("المفتاح غير صحيح.");
        return;
      }

      const del = await fetch(`${FIREBASE_URL}/ads/${id}.json`, {
        method: "DELETE"
      });

      if (!del.ok) throw new Error("fail");

      removeMyKey(id);
      await loadAds();
      alert("تم الحذف.");
    } catch (err) {
      alert("تعذر الحذف.");
    }
  }

  // ====== تشغيل أولي ======
  loadAds();
</script>

</body>
</html>
