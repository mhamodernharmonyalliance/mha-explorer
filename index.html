<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnostic Test</title>
  <style>
    body { background: #111; color: #fff; font-family: monospace; padding: 20px; line-height: 1.6; }
    .log-box { background: #222; border: 1px solid #444; padding: 15px; border-radius: 8px; margin-top: 20px; word-break: break-all; }
    .success { color: #4caf50; font-weight: bold; }
    .error { color: #ff6b6b; font-weight: bold; }
    .info { color: #00bcd4; }
  </style>
</head>
<body>
  <h2>🔍 فحص النظام (Diagnostic)</h2>
  <div id="log" class="log-box">جاري بدء الفحص...</div>

  <script>
    const logDiv = document.getElementById('log');
    const log = (msg, className = '') => {
      logDiv.innerHTML += `<div class="${className}">${msg}</div>`;
      console.log(msg);
    };

    // الخطوة 0: إلغاء الـ Service Worker لتدمير الكاش
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        if (registrations.length === 0) {
           log("0. لا يوجد Service Worker مسجل. جيد.", "info");
        }
        for (let registration of registrations) {
          registration.unregister();
          log("0. تم إلغاء Service Worker القديم بنجاح! ✅", "success");
        }
      });
    } else {
      log("0. المتصفح لا يدعم Service Worker.", "info");
    }

    // الخطوة 1: اختبار الاتصال بـ Firebase
    async function testFirebase() {
      log("<br>1. جاري اختبار الاتصال بـ Firebase...");
      const url = "https://mhaexplorer-ac7a7-default-rtdb.europe-west1.firebasedatabase.app/ads.json";
      
      try {
        const res = await fetch(url);
        log(`   حالة الاتصال (HTTP Status): ${res.status}`);
        
        const textData = await res.text();
        log(`   الرد الخام: ${textData.substring(0, 200)}...`); // نطبع أول 200 حرف فقط
        
        if (!res.ok) {
            log("   ❌ فشل الاتصال! قواعد Firebase تمنع القراءة أو الرابط خطأ.", "error");
        } else if (textData === "null") {
            log("   ✅ الاتصال ناجح! لكن قاعدة البيانات فارغة (لا توجد إعلانات).", "success");
        } else if (textData.includes('"error"')) {
            log("   ❌ Firebase رفض الطلب! (خطأ في الصلاحيات).", "error");
        } else {
            log("   ✅ الاتصال ناجح! وهناك بيانات في قاعدة البيانات.", "success");
        }
      } catch (e) {
        log(`   ❌ فشل الاتصال تماماً! السبب: ${e.message}`, "error");
      }
    }

    // الخطوة 2: اختبار الاتصال بالـ Worker
    async function testWorker() {
      log("<br>2. جاري اختبار الاتصال بالـ Worker (API)...");
      try {
        const res = await fetch("/api/publish", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({}) // بيانات فارغة، هدفنا فقط رؤية هل الـ Worker يرد
        });
        log(`   حالة الاتصال (HTTP Status): ${res.status}`);
        const data = await res.json();
        log(`   رد الـ Worker: ${JSON.stringify(data)}`);
        
        if (res.status === 400) {
            log("   ✅ الـ Worker يعمل! (رفض الطلب لأنه فارغ، وهذا طبيعي).", "success");
        } else {
            log("   ⚠️ الـ Worker رد بشكل غير متوقع. راجع الإعدادات.", "error");
        }
      } catch (e) {
        log(`   ❌ فشل الاتصال بالـ Worker! السبب: ${e.message}`, "error");
      }
    }

    // تشغيل الفحوصات
    setTimeout(async () => {
        await testFirebase();
        await testWorker();
        log("<br>🏁 انتهى الفحص. يرجى تصوير هذه الشاشة وإرسالها.");
    }, 1000);

  </script>
</body>
</html>    }

    // تحميل الإعلانات فور فتح الصفحة
    loadAds();
  </script>
</body>
</html>
