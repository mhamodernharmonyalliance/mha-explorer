<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MHA Explorer — Soon</title>
<meta name="description" content="MHA Explorer — قريباً. تبادل المراجع الدراسية.">
<style>
  :root {
    --navy: #1B3A5C;
    --gold: #D4A93C;
    --ink: #1A1A1A;
    --paper: #F5F0E6;
    --crimson: #B22222;
    --border: rgba(212, 169, 60, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Noto Serif', 'Noto Serif SC', serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.9;
    padding: 30px 20px;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(27,58,92,0.05) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(212,169,60,0.07) 0%, transparent 45%);
  }

  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 50px 40px;
    max-width: 560px;
    width: 100%;
    text-align: center;
    box-shadow: 0 4px 20px rgba(27,58,92,0.08);
    position: relative;
    overflow: hidden;
  }

  /* زوايا ذهبية */
  .card::before,
  .card::after {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    border-color: var(--gold);
    border-style: solid;
  }
  .card::before {
    top: 10px;
    right: 10px;
    border-width: 1px 1px 0 0;
  }
  .card::after {
    bottom: 10px;
    left: 10px;
    border-width: 0 0 1px 1px;
  }

  /* العلامة المائية MHA */
  .watermark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Noto Serif', serif;
    font-size: 140px;
    font-weight: 700;
    color: var(--gold);
    opacity: 0.05;
    pointer-events: none;
    z-index: 0;
    letter-spacing: 10px;
  }

  .content { position: relative; z-index: 1; }

  .logo {
    width: 140px;
    height: 140px;
    object-fit: contain;
    filter: drop-shadow(0 4px 10px rgba(27,58,92,0.25));
    transition: transform 0.6s ease;
    margin-bottom: 16px;
  }
  .logo:hover { transform: scale(1.05); }

  .brand {
    font-size: 1.7rem;
    color: var(--navy);
    letter-spacing: 4px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .tagline {
    font-size: 1rem;
    color: var(--crimson);
    letter-spacing: 2px;
    margin-bottom: 24px;
  }

  .divider {
    width: 60px;
    height: 2px;
    background: var(--gold);
    margin: 22px auto;
  }

  .soon {
    font-size: 2.6rem;
    color: var(--navy);
    letter-spacing: 10px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .soon-sub {
    font-size: 1rem;
    color: var(--gold);
    letter-spacing: 6px;
    margin-bottom: 24px;
  }

  .message {
    font-size: 0.98rem;
    color: #555;
    line-height: 2;
  }

  .message strong {
    color: var(--navy);
  }

  .seal {
    color: var(--crimson);
    font-size: 1.3rem;
    margin-top: 26px;
    display: block;
  }

  @media (max-width: 600px) {
    .card { padding: 40px 24px; }
    .logo { width: 110px; height: 110px; }
    .brand { font-size: 1.4rem; letter-spacing: 2px; }
    .soon { font-size: 2rem; letter-spacing: 6px; }
    .soon-sub { font-size: 0.85rem; letter-spacing: 4px; }
    .watermark { font-size: 90px; }
    .message { font-size: 0.92rem; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="watermark">MHA</div>

    <div class="content">
      <img src="mha-logo.png" alt="MHA — Modern Harmony Alliance" class="logo">
      <div class="brand">MHA Explorer</div>
      <div class="tagline">حيث العلم يُنشر</div>

      <div class="divider"></div>

      <div class="soon">SOON</div>
      <div class="soon-sub">PI</div>

      <p class="message">
        <strong>MHA Explorer</strong> مساحة أكاديمية مستقلة،<br>
        لتبادل المراجع الدراسية والمذكرات والملخصات.<br>
        قريباً.
      </p>

      <span class="seal">印</span>
    </div>
  </div>

</body>
</html>
